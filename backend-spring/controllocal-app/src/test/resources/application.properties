# =====================================================================
# Configuracion que SOLO aplica a los tests de este modulo.
#
# POR QUE EXISTE: "sorry, too many clients already"
#
# Cada @SpringBootTest levanta su propio contexto, y Spring los cachea todos
# durante la ejecucion de la suite. Cada contexto trae su pool de HikariCP, que
# por defecto abre hasta 10 conexiones -- asi que doce contextos reservan 120
# conexiones contra un PostgreSQL que admite 100, y el contexto numero doce
# falla al arrancar.
#
# El fallo NO sale donde esta la causa: revienta el test que tuvo la mala suerte
# de pedir contexto ultimo, y ese test no tiene nada que ver. Costo un rato
# entender que el "Failed to load ApplicationContext" de
# VocabularioPersistidoIntegrationTest lo habia provocado anadir un test nuevo
# en otro sitio.
#
# La causa real es que los tests acaparan conexiones que no usan: son de un solo
# hilo y les basta con dos. Subir max_connections en PostgreSQL habria escondido
# el problema hasta la proxima tanda -- E2.5 y E2.6 traen mas contextos.
# =====================================================================

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0

# Y que suelten la conexion en cuanto dejen de usarla, para que un contexto
# cacheado y ocioso no siga ocupando su sitio.
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=60000
