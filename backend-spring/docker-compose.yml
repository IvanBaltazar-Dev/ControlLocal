# BD v2 del Strangler (PostgreSQL). La MySQL v1 (RDS) sigue sirviendo al backend Jakarta.
# Puerto 5433 en el host para no chocar con un PostgreSQL local en 5432.
services:
  postgres:
    # PostGIS, no postgres a secas: el modelo universal (D-E4-1) guarda la
    # ubicacion como geography(Point,4326) para poder buscar por cercania y,
    # mas adelante, por poligono de zona. La imagen esta construida SOBRE
    # postgres:17-alpine, asi que el volumen de datos existente se monta sin
    # migracion: mismo major, mismo formato de datadir.
    image: postgis/postgis:17-3.5-alpine
    container_name: controllocal-postgres-v2
    environment:
      POSTGRES_DB: controllocal_dev
      POSTGRES_USER: controllocal
      POSTGRES_PASSWORD: controllocal # solo desarrollo local; en despliegue va por secreto
    ports:
      - "5433:5432"
    volumes:
      - controllocal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controllocal -d controllocal_dev"]
      interval: 5s
      timeout: 3s
      retries: 12

  # API v2 en contenedor: es la via para correr el backend desde sesiones de
  # Claude Code (los procesos java descendientes del harness no pueden crear el
  # pipe loopback del selector NIO en esta maquina). Desde IntelliJ se puede
  # seguir corriendo ControlLocalApplication directamente contra localhost:5433.
  api:
    image: eclipse-temurin:21-jre-alpine
    container_name: controllocal-api-v2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/controllocal_dev
      DB_USER: controllocal
      DB_PASSWORD: controllocal
      CORS_ORIGENES: http://localhost:4200
      # Almacen de binarios FUERA de la capa de escritura del contenedor.
      # Antes caia en ./almacen-dev (relativo al workdir), asi que un
      # `docker compose up --force-recreate` borraba fotos y documentos.
      ALMACEN_DIR: /var/lib/controllocal/almacen
    ports:
      - "8090:8090"
    volumes:
      - ./controllocal-app/target/controllocal-app-2.0.0-SNAPSHOT.jar:/app/app.jar:ro
      - controllocal_almacen:/var/lib/controllocal/almacen
    command: ["java", "-jar", "/app/app.jar"]

  # Servicio compatible con S3 para desarrollo. NO es una eleccion de
  # proveedor productivo: el informe de tecnologias deja esa decision abierta
  # (depende del entorno de despliegue, Bloque 9) y `AlmacenS3` habla el
  # protocolo, no el producto. MinIO esta aqui porque es el mas comodo de
  # levantar en una portatil.
  #
  # AVISO DE LICENCIA: MinIO es AGPL-3.0. Para correrlo en la maquina de un
  # desarrollador da igual, pero **no vale como eleccion productiva sin
  # revisarlo**, y menos con el North Star de distribuir ControlLocal como
  # producto. SeaweedFS (Apache-2.0) es el candidato permisivo. Cambiar de uno
  # a otro no toca codigo: solo el endpoint.
  #
  # Perfil `s3`: NO arranca con `docker compose up`. Hay que pedirlo
  # (`--profile s3`), porque el proveedor por defecto sigue siendo DISCO y un
  # servicio que nadie usa es superficie que no hay que tener encendida.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: controllocal-minio
    profiles: ["s3"]
    environment:
      MINIO_ROOT_USER: controllocal
      MINIO_ROOT_PASSWORD: controllocal-dev-2026 # publicada a proposito: solo escucha en localhost
    ports:
      - "127.0.0.1:9000:9000"   # API S3
      - "127.0.0.1:9001:9001"   # consola web
    volumes:
      - controllocal_minio:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Crea el bucket y se muere. Sin esto el primer PutObject falla con
  # NoSuchBucket, que es justo el error que mas tiempo hace perder porque
  # parece un problema de credenciales.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: controllocal-minio-init
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 controllocal controllocal-dev-2026 &&
      mc mb --ignore-existing local/controllocal-dev &&
      echo 'bucket controllocal-dev listo'
      "

volumes:
  controllocal_pg_data:
  controllocal_minio:
  # Binarios (fotos de locales, foto de perfil y expediente documental).
  # Volumen con nombre: sobrevive a `down`, a `up --force-recreate` y a
  # reiniciar la maquina. Solo `down -v` lo borra, y eso es deliberado.
  controllocal_almacen:
