    var falta = k.meta - k.actual;
    /* Mitad de una pareja: "Meta 24" arriba y "Meta hasta hoy 21" debajo son LA
       MISMA META medida en dos momentos. De que periodo hablan lo dice la
       cabecera -- "mes en curso · dia 26 de 30" --, que es ademas de donde sale
       el 21. Meterlo en esta linea partia las cuatro tarjetas en dos renglones. */
    var cab = "Meta <b>" + k.meta + "</b>";
    if (falta === 0) return cab + " · alcanzada";
    if (falta < 0) return cab + " · superada por " + (-falta);
    var v = voz();
    return cab + " · " + (falta === 1 ? v.falta1 + " 1 " + k.u1 : v.faltaN + " " + falta + " " + k.u);
  }

  /* SEGUNDA LINEA: la REFERENCIA temporal, dicha con su nombre.
     Antes decia "1 por delante del plan" y era ilegible por dos motivos: "el
     plan" no se define en ninguna parte de la tarjeta, y al lado de "te faltan
     2" parece una contradiccion -- ¿me faltan dos y voy uno por delante?
     Las dos cosas son ciertas y hablan de cosas distintas: una del total del
     periodo y otra del calendario. Ahora se ensena EL DATO -- cuanto tocaria a
     estas alturas -- y la comparacion la hace el ojo contra la cifra de la
     esfera, que esta a dos centimetros. El veredicto ya lo da el rotulo.

     Y se dice "META HASTA HOY: 21". Las dos versiones anteriores fallaban por
     el mismo sitio, no decir DE DONDE SALE EL 21:
       · "Previsto a hoy: 21"  -- "previsto" es de cronograma y "a hoy" de
         asiento contable, y ninguna de las dos palabras lo ata a la meta.
       · "Para hoy tocan 21"   -- suena a lista de tareas del dia: "¿hoy tengo
         que hacer 21 prospecciones?". Y sigue sin decir de donde sale.
     "Meta hasta hoy" lo resuelve con la linea de arriba: si alli pone "Meta
     del mes 24", aqui se entiende solo -- es la misma meta, medida hasta hoy.

     CUARTO INTENTO, y el fallo de "Meta hasta hoy" era GRAVE: con dos lineas
     seguidas empezando por "Meta" -- 24 arriba, 21 abajo -- el lector entiende
     que hay DOS metas, y que la de hoy YA ESTA CUMPLIDA con 22. O sea, lo
     contrario de lo que hay que entender: vas por delante del ritmo Y TE
     SIGUEN FALTANDO 2. Aqui no se dice "meta": esta cifra no es un objetivo,
     es DONDE DEBERIAS ESTAR HOY para llegar al objetivo. Y el adelanto o el
     retraso deja de ser una resta mental: sale como marca al lado del estado. */
  function lineaRitmo(est, k) {
    /* SIN COLA DE CALENDARIO. "· quedan 4 dias" repetia lo que la cabecera de la
       tarjeta ya dice, y entre las dos partia esta linea en dos renglones en 64
       de 200. El calendario vive arriba, una vez para los cuatro KPI. */
    /* La unidad concuerda: "1 solicitudes" salia en agente / 7 dias / sin meta. */
    if (est.sinMeta) return k.actual + " " + (k.actual === 1 ? k.u1 : k.u) + " · no hay ritmo que evaluar";
    /* "Sin cadencia que medir": cadencia es palabra de musica. */
    if (est.bajoVolumen) return "Muy pocos para medir ritmo";
    if (est.pronto) return "El periodo recién empieza";
    return voz().debe + " <b>" + est.esperado + "</b>";
  }

  /* LA MARCA DE ADELANTO. Es la respuesta a "¿y esto es bueno o malo?": la
     resta contra donde deberias estar hoy, con signo y con voz.
     · Solo aparece cuando HAY referencia -- sin meta, con volumen bajo o en los
       primeros dias no hay nada contra lo que compararse.
     · Ir por delante NO es haber terminado, y por eso la marca convive con
       "te faltan 2": una habla del calendario y la otra del objetivo. */
  function marcaRitmo(est, k) {
    if (est.sinMeta || est.bajoVolumen || est.pronto) return "";
    var d = k.actual - est.esperado;
    if (d === 0) return "<span class='marca eq'>al día</span>";
    var q = voz().quien;
    if (d > 0) return "<span class='marca mas' title='" + q + " " + d + " por delante de donde debería estar hoy'>+" + d + "</span>";
    return "<span class='marca menos' title='" + q + " " + (-d) + " por detrás de donde debería estar hoy'>−" + (-d) + "</span>";
  }

  /* TERCERA LINEA: QUE MIDE este KPI, con su origen y su destino.
     Decia "con tu tasa, harian falta 3 prospecciones mas" y fallaba por lo
     mismo que la segunda: hablaba de "tu tasa" sin ensenarla en ninguna parte.
     La tasa es lo que hay que decir, y se dice como se habla en una oficina
     comercial -- de cada diez, cuantas pasan -- no como un porcentaje suelto.
     El calculo de cuanto habria que abrir vive ahora en el panel, que es su
     sitio: es una estimacion, no un hecho. */
  function conversion(k) {
    if (k.nota) return k.nota;
    if (!k.origen || !k.origen.de) return "";
    if (!k.actual) return "Sin conversión todavía · 0 de " + k.origen.de;
    var diez = Math.round(k.actual / k.origen.de * 10);
    if (diez === 0) return "Menos de <b>1 de cada 10</b> " + k.origen.que + " " + k.origen.verbo;
    return "<b>" + diez + " de cada 10</b> " + k.origen.que + " " + k.origen.verbo;
  }

  /* EL RITMO NO SE CALCULA AQUI. Lo devuelve el núcleo -- y en producción,
     el backend -- ya decidido: actual, metaPeriodo, metaEsperadaAHoy,
     proyeccionCierre, porcentajeProyectado y estadoRitmo. Esta función solo
     traduce ese objeto al vocabulario visual de la tarjeta, que es lo único
     que le toca a una pantalla.

     El Inicio recibe EXACTAMENTE el mismo objeto (su pie llama a
     NB.kpisDe con el mismo ámbito y el mismo periodo), y por eso ya no
     pueden pintar dos colores distintos para la misma cifra. */
  var VISUAL = {
    EN_RITMO:       { clave: "verde",  color: "var(--positivo-voz)" },
    ATENCION:       { clave: "ambar",  color: "var(--atencion-voz)" },
    FUERA_DE_RITMO: { clave: "rojo",   color: "var(--riesgo-voz)" },
    SIN_BASE:       { clave: "neutro", color: "var(--ink-3)" }
  };
  function ritmoDe(actual, meta) {
    var r = NB.ritmoDe(actual, meta, PERIODO);
    var v = VISUAL[r.estadoRitmo];
    return {
      sinMeta: !meta,
      bajoVolumen: !!r.sinCadencia,
      pronto: !!r.arranque,
      esperado: r.metaEsperadaAHoy,
      proyectado: r.proyeccionCierre,
      cumplimiento: r.porcentajeProyectado === null ? null : r.porcentajeProyectado / 100,
      estadoRitmo: r.estadoRitmo,
      clave: v.clave,
      e: r.voz,
      color: v.color
    };
  }

  /* ---------- La esfera: cinco cosas en un instrumento ----------
     Recorrido de 270 grados en vez de circulo completo. Con el circulo
     entero la meta cae en el mismo punto que el origen y la "marca de meta"
     no se puede dibujar; con 270 la meta es el final del recorrido y hay
     sitio para la marca de ritmo esperado. */

  function esfera(est, actual, meta, universo) {
    var cx = 34, cy = 34, r = 26, grosor = 6, ini = 135, barrido = 270;
    var C = 2 * Math.PI * r, arco = C * barrido / 360;
    var pista = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#EFEFEA" stroke-width="' + grosor +
      '" stroke-linecap="round" stroke-dasharray="' + arco.toFixed(1) + ' ' + C.toFixed(1) + '"/>';

    /* Sin meta no hay recorrido que dibujar: ni arco, ni marcas, ni manija.
       Una esfera vacia dice "aqui no hay nada que medir" mejor que un cero. */
    if (est.sinMeta) {
      return '<svg width="68" height="68" viewBox="0 0 68 68" aria-hidden="true">' +
        '<g transform="rotate(' + ini + ' ' + cx + ' ' + cy + ')">' + pista + "</g></svg>";
    }

    /* LA ESCALA ES EL UNIVERSO del que sale la cifra, no la meta. Con la meta
       de denominador, la esfera decia "22 de 24" y la sub-linea "de 31": dos
       escalas distintas en una tarjeta, y ninguna cuadraba con la otra. Ahora
       lo hecho, la meta, lo previsto y la proyeccion son posiciones sobre LA
       MISMA REGLA -- y la meta deja de ser denominador para ser una marca. */
    var escala = Math.max(universo || meta, meta);
    var frac = Math.min(actual / escala, 1);
    var fracProy = Math.min(est.proyectado / escala, 1);
    var metaFrac = Math.min(meta / escala, 1);
    var rad = function (a) { return (ini + a) * Math.PI / 180; };
    var punto = function (a, radio) { return [cx + radio * Math.cos(rad(a)), cy + radio * Math.sin(rad(a))]; };
    var marca = function (a, largo, ancho, tono, op) {
      var d = punto(a, r - grosor / 2 - largo), h = punto(a, r + grosor / 2 + largo);
      return '<line x1="' + d[0].toFixed(1) + '" y1="' + d[1].toFixed(1) + '" x2="' + h[0].toFixed(1) + '" y2="' + h[1].toFixed(1) +
        '" stroke="' + tono + '" stroke-width="' + ancho + '" stroke-linecap="round" opacity="' + op + '"/>';
    };
    var mano = punto(frac * barrido, r);
    var espFrac = est.esperado === null ? null : Math.min(est.esperado / escala, 1);
    /* EL ARCO LLEVA EL ESTADO, no la identidad del KPI. La identidad vive en
       el filete de la cabecera: el anillo es un instrumento de estado y el
       rotulo de arriba ya dice de que KPI se trata. Con el arco en color de
       identidad, la pantalla se contradecia -- anillo azul y "fuera de
       ritmo" en rojo a dos centimetros. */
    var tono = est.clave === "verde" ? "#05AC65" : (est.clave === "ambar" ? "#E69500" : "#DD4546");

    return '<svg width="68" height="68" viewBox="0 0 68 68" aria-hidden="true">' +
      '<g transform="rotate(' + ini + ' ' + cx + ' ' + cy + ')">' + pista +
      /* fantasma: hasta donde llegaras si mantienes el ritmo */
      '<circle class="proy" cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + tono + '" stroke-width="' + grosor +
      '" stroke-linecap="round" opacity=".28" stroke-dasharray="' + (arco * fracProy).toFixed(1) + ' ' + C.toFixed(1) + '"/>' +
      '<circle class="arco" cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + tono + '" stroke-width="' + grosor +
      '" stroke-linecap="round" stroke-dasharray="' + (arco * frac).toFixed(1) + ' ' + C.toFixed(1) + '"/></g>' +
      /* marca de META al final del recorrido, y de ESPERADO A HOY dentro */
      marca(metaFrac * barrido, 2.5, 1.7, "#14191E", ".95") +
      /* Sin cadencia diaria no hay "esperado a hoy" que marcar. */
      (espFrac === null ? "" : marca(espFrac * barrido, 1.5, 1.4, "#6C7681", ".7")) +
      '<circle class="manija" cx="' + mano[0].toFixed(1) + '" cy="' + mano[1].toFixed(1) + '" r="3.4" fill="#FFFFFF" stroke="' +
      tono + '" stroke-width="2.4"/>' + "</svg>";
  }

  /* ---------- Datos ----------
     Los cuatro KPI son los MISMOS para los dos roles. Cambia el alcance:
     individual frente a suma del equipo. */

  /* ============================================================
     DATOS — TODOS del núcleo. Esta pantalla no guarda un solo hecho: lo
     que sigue es la PROYECCIÓN de `nucleo-brox.js` a las formas que
     dibujan las tarjetas.

     Los cuatro KPI, el embudo, la cartera, el pulso y las excepciones
     salen de los mismos contadores por agente, así que no pueden
     desmentirse entre sí ni desmentir al Inicio.
     ============================================================ */

  function ambitoDe(id) { return id ? { tipo: "AGENTE", id: id } : { tipo: "EQUIPO" }; }

  /* [origen, destino, N, avanzaron] — la forma que dibuja el embudo. */
  function saltos(l) {
    return l.map(function (s) { return [s.de, s.a, s.n, s.avanzo]; });
  }

  function kpisProyectados(ambito) {
    var esc = opciones();
    return NB.kpisDe(ambito, periodo, esc).map(function (k) {
      var nota = null;
      /* Muestra escasa: la advertencia es de la CONVERSION, no del KPI. Un
         conteo contra una meta siempre tiene base. */
      if (esc.escasa && k.conversion && !k.conversion.fiable) {
        nota = "Solo " + NB.plural(k.conversion.de, k.origen.que.replace(/s$/, ""), k.origen.que) +
          ": aún sin conversión fiable";
      }
      return {
        clave: k.clave, rot: k.rotulo, u: k.u, u1: k.u1,
        actual: k.actual, meta: k.metaPeriodo, serie: k.serie,
        origen: k.origen.de ? k.origen : null, nota: nota,
        /* El objeto del núcleo viaja entero: la tarjeta puede leer el estado
           sin volver a deducirlo. */
        ritmo: k
      };
    });
  }

  function seriesDe(ambito) {
    var base = ambito.tipo === "EQUIPO" ? NB.SERIES.EQUIPO : (NB.SERIES[ambito.id] || NB.SERIES.EQUIPO);
    var metas = {};
    NB.KPIS.definiciones.forEach(function (d) {
      metas[d.clave] = NB.kpiDe(ambito, d.clave, periodo, opciones()).metaPeriodo;
    });
    return { series: base, metasSerie: metas };
  }

  /* Las acciones de esta pantalla SON los tres primeros asuntos del foco del
     Inicio: misma política de despacho, mismos nombres, misma prioridad. */
  function accionesDe(rol) {
    return NB.accionesDe(rol).map(function (a) {
      return { q: a.titulo, pr: a.prioridad, d: a.detalle };
    });
  }
  /* Y el desglose agrupa esos mismos asuntos, así que su suma es el total. */
  function clasesDe(rol) {
    var g = { fecha: 0, seguimiento: 0, expediente: 0 };
    NB.asuntosActivos(rol).forEach(function (a) { g[a.grupo]++; });
    return [
      [String(g.fecha), "con fecha próxima", "r"],
      [String(g.seguimiento), "en seguimiento", "a"],
      [String(g.expediente), "esperando expediente", "a"]
    ].filter(function (c) { return c[0] !== "0"; });
  }

  function agente(id) {
    var ambito = ambitoDe(id), g = NB.GESTION[id], e = NB.embudos(ambito, periodo, opciones());
    var c = e.contadores, ev = seriesDe(ambito);
    var aprobadasSinFirmar = c.aprobadas - c.contrato;
    /* «Con movimiento» son los que YA tienen interesado: ni los que aún no
       lo tienen (Activa) ni los que ya cerraron (Alquilada). Decir 62 %
       metiendo los alquilados contradecía a la tarjeta de al lado. */
    var CON_INTERESADO = ["Interesados", "Solicitud", "Evaluación"];
    var conMovimiento = g.etapa.filter(function (x) { return CON_INTERESADO.indexOf(x[0]) !== -1; })
      .reduce(function (t, x) { return t + x[1]; }, 0);

    return {
      n: NB.nom(id), ini: NB.per(id).ini, r: "Agente",
      titulo: "Indicadores comerciales", ambito: "Tu gestión",
      kTira: "Rendimiento", kLectura: "Cómo vas", kCartera: "Cartera",
      vistas: [{ v: "resumen", e: "Resumen" }, { v: "lectura", e: "Cómo vas" },
        { v: "cartera", e: "Cartera" }, { v: "proceso", e: "Proceso" }],

      kpis: kpisProyectados(ambito),

      lectura: [
        { t: "Vas bien", mk: "mk-b", voz: "var(--positivo-voz)", items: [
          { n: "Cartera con movimiento", c: String(NB.pc(conMovimiento, g.cartera)), u: "%",
            b: NB.pc(conMovimiento, g.cartera), d: "+7 pp",
            e: conMovimiento + " de " + g.cartera + " tienen interesado" },
          { n: "Visitas con resultado", c: String(NB.pc(g.visitasConResultado, NB.PRODUCCION[id].visitas)), u: "%",
            b: NB.pc(g.visitasConResultado, NB.PRODUCCION[id].visitas), d: "+8 pp", e: "registradas el mismo día" },
          { n: "Captaciones sin observación", c: String(NB.pc(g.captacionesSinObservacion, g.captacionesRevisadas)), u: "%",
            b: NB.pc(g.captacionesSinObservacion, g.captacionesRevisadas), d: "+4 pp", e: "pasan revisión a la primera" }
        ]},
        { t: "Atiende esto", mk: "mk-c", voz: "var(--atencion-voz)", items: [
          { n: "Seguimiento al día", c: String(NB.pc(g.recontactos - g.recontactosVencidos, g.recontactos)), u: "%",
            b: NB.pc(g.recontactos - g.recontactosVencidos, g.recontactos), d: "−9 pp",
            e: NB.plural(g.recontactosVencidos, "recontacto vencido", "recontactos vencidos") },
          { n: "Aprobadas sin firmar", c: String(aprobadasSinFirmar), d: "+6 días", pegado: true,
            e: "de espera frente al periodo anterior" },
          { n: "Tiempo publicado", c: String(g.diasPublicadoMedia), u: "días de media",
            b: NB.pc(g.diasPublicadoMedia, NB.POLITICA.tiempoPublicadoUmbralDias),
            bt: "sobre el umbral de " + NB.POLITICA.tiempoPublicadoUmbralDias + " días", d: "+16 días",
            e: NB.plural(g.localesSobreUmbral, "local pasa", "locales pasan") + " de " + NB.POLITICA.tiempoPublicadoUmbralDias + " días" }
        ]},
        { t: "Adelántate", mk: "mk-m", voz: "var(--accion)", items: [
          { n: "Encargos por vencer", c: String(g.encargosPorVencer),
            e: NB.plural(g.encargosSinExclusividad, "sin exclusividad", "sin exclusividad") },
          { n: "Renta sin ajustar", c: String(g.rentaSinAjustar), u: "de " + g.cartera + " en cartera",
            b: NB.pc(g.rentaSinAjustar, g.cartera),
            e: "sin cambio hace más de " + NB.POLITICA.rentaSinAjustarDias + " días" },
          { n: "Fichas incompletas", c: String(g.fichasIncompletas), u: "de " + g.cartera,
            b: NB.pc(g.fichasIncompletas, g.cartera), e: "falta metraje o fotos" }
        ]}
      ],

      focoDe: NB.asuntosActivos("AGENTE").length,
      clases: clasesDe("AGENTE"),
      acciones: accionesDe("AGENTE"),

      carteraTotal: g.cartera,
      salud: [{ v: String(g.sinMovimiento90), e: "sin movimiento en 90 días", ojo: true },
        { v: Math.round(g.rentaEnDolares * 100) + " %", e: "de la renta en US$" }],
      ejes: [{ v: "etapa", e: "Etapa" }, { v: "lugar", e: "Distrito" }],
      etapa: g.etapa, lugar: g.distrito,

      oferta: saltos(e.oferta), demanda: saltos(e.demanda),

      evoMetricas: [{ v: "captacion", e: "Locales captados" }, { v: "solicitud", e: "Solicitudes ingresadas" },
        { v: "contrato", e: "Contratos firmados" }],
      series: ev.series, metasSerie: ev.metasSerie
    };
  }

  function broker() {
    var ambito = ambitoDe(null), e = NB.embudos(ambito, periodo, opciones());
    var c = e.contadores, ev = seriesDe(ambito);
    var pulso = NB.pulsoEquipo(periodo, opciones());
    var conc = NB.concentracionCartera();
    var total = NB.carteraTotalEquipo();
    var aprobadasSinFirmar = c.aprobadas - c.contrato;
    var vencidos = NB.equipoSuma("recontactosVencidos");
    var conVencidos = NB.AGENTES.filter(function (id) { return NB.GESTION[id].recontactosVencidos > 0; }).length;
    var recontactos = NB.equipoSuma("recontactos");
    var enRitmo = pulso.por[NB.RITMO.EN_RITMO].length;
    var visitasEq = NB.equipoSuma("visitasConResultado");
    var sinObs = NB.equipoSuma("captacionesSinObservacion"), revisadas = NB.equipoSuma("captacionesRevisadas");
    /* Media ponderada por cartera: un agente con 20 locales pesa más que uno
       con 1, y de otro modo la media del equipo no cuadra con sus partes. */
    var diasPublicado = Math.round(NB.AGENTES.reduce(function (t, id) {
      return t + NB.GESTION[id].diasPublicadoMedia * NB.GESTION[id].cartera;
    }, 0) / NB.AGENTES.reduce(function (t, id) { return t + NB.GESTION[id].cartera; }, 0));

    return {
      n: NB.per(NB.BROKER_VISTA).nombre, ini: NB.per(NB.BROKER_VISTA).ini, r: "Broker supervisor",
      titulo: "Indicadores comerciales", ambito: "Tu equipo",
      kTira: "Rendimiento del equipo", kLectura: "Cómo va el equipo", kCartera: "Cartera",
      vistas: [{ v: "resumen", e: "Resumen" }, { v: "lectura", e: "El equipo" },
        { v: "cartera", e: "Cartera" }, { v: "proceso", e: "Proceso" }],
      agentes: NB.AGENTES.length,

      kpis: kpisProyectados(ambito),

      /* GROUP BY estadoRitmo: la suma de los grupos ES el equipo. */
      pulso: pulso.grupos.map(function (gr) {
        return { e: gr.voz, n: gr.n, color: VISUAL[gr.estadoRitmo].color };
      }),
      /* Y las excepciones son exactamente los agentes que ese GROUP BY deja
         fuera de EN_RITMO. Nunca un ranking, y nunca una fila inventada. */
      excepciones: NB.excepcionesEquipo(periodo, opciones()).map(function (x) {
        return {
          q: x.nombre, brecha: x.brecha.rotulo,
          cf: x.brecha.metaEsperadaAHoy === null
            ? x.brecha.actual + " de " + x.brecha.metaPeriodo
            : x.brecha.actual + " · hoy debería ir por " + x.brecha.metaEsperadaAHoy,
          color: VISUAL[x.estadoRitmo].color
        };
      }),

      supervision: [
        { rot: "Captaciones", v: String(porRevisar()), u: "por revisar", d: "1 fuera de plazo", e: "var(--atencion-voz)" },
        { rot: "Evaluaciones", v: String(porDecidir()), u: "por decidir", d: "2 días de espera", e: "var(--atencion-voz)" },
        { rot: "Seguimiento", v: String(NB.pc(recontactos - vencidos, recontactos)), u: "% al día",
          d: NB.plural(conVencidos, "agente por debajo", "agentes por debajo") },
        { rot: "Carga", v: "1", u: "sobrecargado", d: conc.porcentaje + " % de la cartera", e: "var(--atencion-voz)" }
      ],

      lectura: [
        { t: "Va bien", mk: "mk-b", voz: "var(--positivo-voz)", items: [
          { n: "Agentes en ritmo", c: String(enRitmo), u: "de " + NB.AGENTES.length,
            b: NB.pc(enRitmo, NB.AGENTES.length), d: "+1", pegado: true, e: "frente al periodo anterior" },
          { n: "Visitas con resultado", c: String(NB.pc(visitasEq, NB.AGENTES.reduce(function (t, id) { return t + NB.PRODUCCION[id].visitas; }, 0))), u: "%",
            b: NB.pc(visitasEq, NB.AGENTES.reduce(function (t, id) { return t + NB.PRODUCCION[id].visitas; }, 0)),
            d: "+5 pp", e: "registradas el mismo día" },
          { n: "Captaciones sin observación", c: String(NB.pc(sinObs, revisadas)), u: "%",
            b: NB.pc(sinObs, revisadas), d: "+4 pp", e: "pasan revisión a la primera" }
        ]},
        { t: "Atiende esto", mk: "mk-c", voz: "var(--atencion-voz)", items: [
          { n: "Seguimientos vencidos", c: String(vencidos),
            d: NB.plural(conVencidos, "agente", "agentes"), pegado: true, e: "concentran todos los vencidos" },
          { n: "Aprobadas sin firmar", c: String(aprobadasSinFirmar), d: "+9 días", pegado: true,
            e: "de espera frente al periodo anterior" },
          { n: "Tiempo publicado", c: String(diasPublicado), u: "días de media",
            b: NB.pc(diasPublicado, NB.POLITICA.tiempoPublicadoUmbralDias),
            bt: "sobre el umbral de " + NB.POLITICA.tiempoPublicadoUmbralDias + " días", d: "+11 días",
            e: NB.plural(NB.equipoSuma("localesSobreUmbral"), "local pasa", "locales pasan") +
              " de " + NB.POLITICA.tiempoPublicadoUmbralDias + " días" }
        ]},
        { t: "Adelántate", mk: "mk-m", voz: "var(--accion)", items: [
          { n: "Encargos por vencer", c: String(NB.equipoSuma("encargosPorVencer")),
            e: NB.plural(NB.equipoSuma("encargosSinExclusividad"), "sin exclusividad", "sin exclusividad") },
          { n: "Renta sin ajustar", c: String(NB.equipoSuma("rentaSinAjustar")), u: "de " + total + " en cartera",
            b: NB.pc(NB.equipoSuma("rentaSinAjustar"), total),
            e: "sin cambio hace más de " + NB.POLITICA.rentaSinAjustarDias + " días" },
          /* El porcentaje va con su concepto: «38 %» a secas no es una
             identidad, y en esta misma pantalla hay otro 38 % que es otra cosa. */
          { n: "Concentración de cartera", c: String(conc.porcentaje), u: "% de la cartera",
            b: conc.porcentaje, e: "en un solo agente: " + conc.nombre }
        ]}
      ],

      focoDe: NB.asuntosActivos("BROKER").length,
      acciones: accionesDe("BROKER"),

      carteraTotal: total,
      salud: [{ v: String(NB.equipoSuma("sinMovimiento90")), e: "sin movimiento en 90 días", ojo: true },
        { v: Math.round(NB.AGENTES.reduce(function (t, id) {
            return t + NB.GESTION[id].rentaEnDolares * NB.GESTION[id].cartera;
          }, 0) / NB.AGENTES.reduce(function (t, id) { return t + NB.GESTION[id].cartera; }, 0) * 100) + " %",
          e: "de la renta en US$" }],
      ejes: [{ v: "etapa", e: "Etapa" }, { v: "lugar", e: "Distrito" }, { v: "quien", e: "Agente" }],
      etapa: NB.CARTERA_EQUIPO.etapa, lugar: NB.CARTERA_EQUIPO.distrito,
      quien: NB.carteraPorAgente().map(function (x) { return [x.nombre, x.cartera]; }),

      oferta: saltos(e.oferta), demanda: saltos(e.demanda),

      /* La media del equipo esconde la distribución: se dice quién la rompe
         y contra qué, con el nombre del indicador delante. */
      concentracion: (function () {
        var l = NB.conversionPorAgente("solicitud").filter(function (x) { return x.fiable; });
        var peor = l[0], resto = l.slice(1).map(function (x) { return x.porcentaje; });
        return peor.nombre + " convierte el " + peor.porcentaje + " % · el resto del equipo, entre " +
          Math.min.apply(null, resto) + " % y " + Math.max.apply(null, resto) + " %";
      })(),

      evoMetricas: [{ v: "prospeccion", e: "Propietarios contactados" }, { v: "captacion", e: "Locales captados" },
        { v: "solicitud", e: "Solicitudes ingresadas" }, { v: "contrato", e: "Contratos firmados" }],
      series: ev.series, metasSerie: ev.metasSerie
    };
  }

  /* Lo que el broker tiene encima de la mesa sale de los expedientes, no de
     una cifra suelta que pueda contradecir a la fila de al lado. */
  function porRevisar() {
    return Object.keys(NB.CAPTACIONES).filter(function (k) {
      return NB.CAPTACIONES[k].estado === "EN_REVISION" || NB.CAPTACIONES[k].estado === "OBSERVADA";
    }).length;
  }
  function porDecidir() {
    return Object.keys(NB.SOLICITUDES).filter(function (k) {
      return NB.SOLICITUDES[k].estado === "POR_EVALUAR";
    }).length;
  }

  /* El equipo es el del núcleo: si se añade un agente allí, aparece aquí. */
  var EQUIPO = NB.AGENTES.map(function (id) { return NB.nom(id); });

  var periodo = "1m", rol = "AGENTE", escenario = "aldia", vistaM = "resumen";
  var abierto = null;                 /* ID del agente que el broker abrió */
  var ejeCartera = "etapa", ejeEmbudo = "demanda", metricaEvo = "captacion";

  /* EL EMBUDO ES UNA CADENA, no tres pares sueltos: el destino de un salto es
     el origen del siguiente, y es EL MISMO NUMERO. Escalando par a par, ese
     numero recibia dos tratamientos distintos -- uno con suelo 0 y otro con
     suelo 1 -- y con "7 dias" un salto acababa en 0 mientras el siguiente
     empezaba en 1. Se escala la cadena una vez y se rearman los pares. */
  /* El embudo ya viene escalado y encadenado del núcleo: aquí no se
     reescala nada, que es lo que hacía que un salto acabara en 0 mientras
     el siguiente empezaba en 1. */

  function R() {
    fijarPeriodo();
    if (rol === "BROKER" && !abierto) return broker();
    var a = agente(rol === "BROKER" && abierto ? abierto : NB.AGENTE_VISTA);
    if (rol === "BROKER" && abierto) a.supervisando = true;
    return a;
  }
  function esBroker() { return rol === "BROKER" && !abierto; }

  function etiqPeriodo() { var p = PERIODOS.filter(function (x) { return x.v === periodo; })[0]; return p ? p.e.toLowerCase() : "1 mes"; }

  function grupo(cont, items, activo, attr) {
    /* La firma lleva TAMBIEN el texto, no solo la clave: las pestañas de movil
       tienen las mismas claves en los dos roles pero distinta etiqueta, y con
       la firma anterior el broker se quedaba con "Como vas" del agente. */
    var firma = items.map(function (i) { return i.v + "=" + i.e; }).join("|");
    if (cont.dataset.firma !== firma) {
      cont.innerHTML = items.map(function (i) {
        return "<button type='button' data-" + attr + "='" + i.v + "'>" + i.e + "</button>";
      }).join("");
      cont.dataset.firma = firma;
    }
    cont.querySelectorAll("button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset[attr] === activo));
    });
  }

  /* ---------- Cabecera ---------- */

  function pCab() {
    var r = R();
    document.getElementById("titulo").textContent = r.titulo;
    document.getElementById("app").classList.toggle("super-ancho", esBroker());
    document.getElementById("sub").innerHTML = r.supervisando
      ? "<b>" + r.n + "</b> · supervisión · " + etiqPeriodo()
      : r.ambito + (esBroker() ? " · <b>" + r.agentes + " agentes</b>" : "") + " · <b>" + etiqPeriodo() + "</b>";

    var m = document.getElementById("mandos");
    var quiere = (rol === "BROKER" ? "sel" : "") + "|" + periodo + "|" + (abierto || "");
    if (m.dataset.firma !== quiere) {
      m.innerHTML =
        (rol === "BROKER" && abierto ? "<button type='button' class='volver' data-volver='1'>" +
          "<svg width='12' height='12' viewBox='0 0 20 20' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><use href='#i-atras'/></svg>Volver al equipo</button>" : "") +
        (rol === "BROKER" && !abierto ? "<select class='filtro-agente' id='sel-agente' aria-label='Filtrar por agente'>" +
          "<option value=''>Todos los agentes</option>" +
          NB.AGENTES.map(function (id) { return "<option value='" + id + "'>" + NB.nom(id) + "</option>"; }).join("") + "</select>" : "") +
        "<div class='periodos' id='periodos' role='group' aria-label='Periodo'></div>";
      m.dataset.firma = quiere;
    }
    grupo(document.getElementById("periodos"), PERIODOS, periodo, "p");
    grupo(document.getElementById("vistas-m"), r.vistas, vistaM, "vm");

    document.getElementById("ac-ini").textContent = r.ini;
    var yo = NB.per(NB.BROKER_VISTA);
    document.getElementById("ac-n").textContent = r.supervisando ? yo.nombre : r.n;
    document.getElementById("ac-r").textContent = r.supervisando ? yo.rotulo : r.r;
  }

  /* ---------- Los cuatro KPI ---------- */

  function pTira() {
    var r = R();
    document.getElementById("k-tira").textContent = r.kTira;
    /* EL PERIODO SE DICE UNA VEZ, AQUI, no cuatro veces dentro de las tarjetas:
       "Meta del mes 24 · te faltan 2 propietarios" no cabia en la linea y
       partia las cuatro en dos renglones. Y aqui hace mas trabajo -- junto al
       "dia 26 de 30" de al lado explica de donde sale la meta hasta hoy. */
    var quedan = PERIODO.dias - PERIODO.transcurridos;
    document.getElementById("der-tira").textContent =
      PERIODO.curso + " · día " + PERIODO.transcurridos + " de " + PERIODO.dias +
      " · quedan " + quedan + " día" + (quedan === 1 ? "" : "s");

    document.getElementById("tira").innerHTML = r.kpis.map(function (k, i) {
      var est = ritmoDe(k.actual, k.meta);
      var centro, lectura, cifras;

      /* La esfera enseña UNA cifra: lo que llevas. El "de 24" que iba dentro
         se leia como fraccion de un universo -- "de 24 personas que prospecte,
         20 fueron efectivas" -- cuando 24 es la META. La meta va fuera y con su
         nombre; su sitio visual es la marca del final del recorrido. */
      /* El denominador de la esfera es EL UNIVERSO -- "22 de 31 prospecciones
         abiertas" -- que es como se lee de forma natural. La meta ya no es
         denominador de nada: es la marca oscura sobre el arco, y su cifra vive
         en la primera linea con su nombre. */
      var universo = k.origen ? k.origen.de : k.meta;
      /* EL ROTULO NOMBRA LA REGLA QUE SE DIBUJA, no otra. El anillo se traza
         sobre `max(universo, meta)` -- si no, la marca de meta se saldria --,
         pero el texto decia siempre el universo. Al principio de un periodo la
         meta es mayor que lo abierto hasta hoy (dia 3 de 7: 4 prospecciones
         abiertas contra una meta semanal de 6), y entonces la esfera dibujaba
         sobre 6 mientras el rotulo decia "de 4": el arco no cuadraba con su
         propio pie en 71 de 200 tarjetas. Ahora el pie dice la escala, y la
         primera linea repite esa cifra con su nombre ("Meta 6") a un
         centimetro, que es lo que la desambigua. */
      var reglaEsfera = Math.max(universo || k.meta, k.meta);
      centro = "<span class='ac'>" + k.actual + "</span>" +
        (k.origen ? "<span class='mt'>de " + reglaEsfera + "</span>" : "");

      return "<div class='kpi' style='--tono:" + RAMPA[i] + "'>" +
        "<span class='rot'>" + k.rot + "</span>" +
        "<div class='fila'>" +
        "<span class='esfera'>" + esfera(est, k.actual, k.meta, universo) +
        "<span class='centro'>" + centro + "</span></span>" +
        "<span class='lado'>" +
        "<span class='fila-e'><span class='ritmo' style='--e:" + est.color + "'><i></i>" + est.e + "</span>" +
        marcaRitmo(est, k) + "</span>" +
        "<p class='avance'>" + lineaMeta(est, k) + "</p>" +
        "<p class='esperado'>" + lineaRitmo(est, k) + "</p>" +
        "</span></div>" +
        "<span class='sub'>" + conversion(k) + "</span></div>";
    }).join("");
  }

  /* ---------- Pulso del equipo y supervisión ---------- */

  function pPulso() {
    var franja = document.getElementById("pulso");
    if (!esBroker()) { franja.hidden = true; return; }
    franja.hidden = false;
    var r = R();
    franja.innerHTML =
      "<div class='pulso'><span class='rot'>Pulso del equipo</span>" +
      r.pulso.map(function (p) {
        return "<span class='e' style='--e:" + p.color + "'><i></i><b>" + p.n + "</b> " + p.e.toLowerCase() + "</span>";
      }).join("") +
      "<button type='button' class='mas'>Ver los " + r.agentes + " agentes →</button></div>" +
      "<div class='excs'>" + r.excepciones.map(function (x) {
        return "<span class='exc' style='--e:" + x.color + "'><i></i>" +
          "<b>" + x.q + "</b><span>·&nbsp;" + x.brecha.toLowerCase() + "</span><em>" + x.cf + "</em></span>";
      }).join("") + "</div>";
  }

  /* ---------- Lectura tripartita ---------- */

  function pLectura() {
    var r = R();
    document.getElementById("k-lectura").textContent = r.kLectura;
    /* La lectura diagnostica el PRESENTE -- la cartera activa o el seguimiento
       al dia son estado, no acumulado. Lo que si cambia con el filtro es
       contra que se comparan sus variaciones. */
    /* "vs. 7 dias anterior" no concuerda ni en numero ni en genero, y "vs." es
       de hoja de calculo. Cada periodo trae ya su nombre en singular. */
    document.getElementById("der-lectura2").textContent = "ahora · frente " + PERIODO.ant;
    document.getElementById("lectura").innerHTML = r.lectura.map(function (b) {
      return "<div class='lec' style='--voz:" + b.voz + "'>" +
        "<div class='lec-cab'><span class='" + b.mk + "'></span><span>" + b.t + "</span></div>" +
        b.items.map(function (x) {
          /* Boton: cada cifra lleva a los registros que la explican (D-E2-3). */
          return "<button type='button' class='ind'" + (x.bt ? " title='" + x.bt + "'" : "") + ">" +
            "<div class='l1'><span class='n'>" + x.n + "</span>" +
            "<span class='c'>" + x.c + (x.u ? "<small>&thinsp;" + x.u + "</small>" : "") + "</span></div>" +
            (x.b === undefined ? "" : "<span class='medida'><i style='width:" + x.b + "%'></i></span>") +
            /* EL PUNTO MEDIO SEPARA HECHOS, NO PARTE FRASES. "+6 días · de
               espera frente al periodo anterior" es UNA frase cortada por la
               mitad; con `pegado` se une con un espacio y se lee entera. */
            "<p class='l2'>" + (x.d ? "<b>" + x.d + "</b>" + (x.pegado ? " " : " · ") : "") + x.e + "</p></button>";
        }).join("") + "</div>";
    }).join("");
  }

  /* ---------- En foco hoy ---------- */

  function pFoco() {
    var r = R();
    var vis = r.acciones.slice(0, 3);
    document.getElementById("der-foco").innerHTML = "<b>" + vis.length + "</b> de " + r.focoDe + " · ahora";
    /* El broker ve el ESTADO de lo que depende de el, no la clasificacion de
       pendientes del agente. Es lo unico de la pantalla que mide su propio
       trabajo: los contratos del equipo no son merito suyo. */
    var cabeza = esBroker()
      ? "<div class='super'>" + r.supervision.map(function (s) {
          /* Botones, como las fichas del agente: cada cifra lleva a su cola. */
          return "<button type='button' class='sup'" + (s.e ? " style='--e:" + s.e + "'" : "") + ">" +
            "<span class='rot'>" + s.rot + "</span>" +
            "<span class='v'>" + s.v + "<small>&thinsp;" + s.u + "</small></span>" +
            "<p class='d'>" + s.d + "</p></button>";
        }).join("") + "</div>"
      : "<div class='clases'>" + r.clases.map(function (c) {
          /* Boton, no <span>: cada cifra lleva a sus registros (D-E2-3). */
          return "<button type='button' class='clase' style='--e:" +
            (c[2] === "r" ? "var(--riesgo-voz)" : "var(--atencion-voz)") + "'>" +
            "<b>" + c[0] + "</b><span>" + c[1] + "</span></button>";
        }).join("") + "</div>";

    /* El pie CUENTA, no repite un numero escrito a mano. Decia "Ver los 12
       asuntos abiertos" con `focoDe` en 12 en otro sitio: dos copias de la
       misma cifra que pueden separarse en cuanto una cambie. */
    var pie = esBroker()
      ? "Ver la bandeja de supervisión →"
      : "Ver " + (r.focoDe === 1 ? "el asunto abierto" : "los " + r.focoDe + " asuntos abiertos") + " →";

    document.getElementById("foco").innerHTML = cabeza +
      vis.map(function (a, i) {
        var alta = a.pr === "Alta";
        return "<button type='button' class='accion' style='--e:" + (alta ? "var(--riesgo-voz)" : "var(--atencion-voz)") + "'>" +
          "<span class='num'>" + (i + 1) + "</span>" +
          "<span class='q'><b>" + a.q + "</b><span class='pr'><i></i>" + a.pr + "</span></span>" +
          "<p class='d'>" + a.d + "</p></button>";
      }).join("") +
      "<button type='button' class='pie-enlace'>" + pie + "</button>";
  }

  /* ---------- Cartera ---------- */

  function pCartera() {
    var r = R();
    document.getElementById("k-cartera").textContent = r.kCartera;
    document.getElementById("der-cartera").textContent = "ahora";
    if (r.ejes.filter(function (e) { return e.v === ejeCartera; }).length === 0) ejeCartera = "etapa";
    grupo(document.getElementById("pest-cartera"), r.ejes, ejeCartera, "eje");

    var datos = r[ejeCartera];
    /* EL RIEL ES LA CARTERA ENTERA, NO LA FILA MAS GRANDE. Se normalizaba
       contra el maximo, asi que la etapa mayor salia a barra llena y se leia
       "toda mi cartera esta en Activa" cuando eran 5 de 13. Los tres ejes suman
       el total, asi que el riel completo significa lo mismo en los tres: el
       hueco es EL RESTO DE LA CARTERA, y por eso ahora significa algo. */
    var total = datos.reduce(function (a, d) { return a + d[1]; }, 0) || 1;
    /* La etapa lleva rampa porque ES un recorrido; distrito y persona van en
       un solo tono, porque entre ellos no hay orden. */
    var rampa = ["#AFC2DE", "#7BA3E5", "#2563EB", "#0F7A85", "#168650"];

    document.getElementById("cartera").innerHTML =
      "<div class='salud'><span class='tot'><b>" + r.carteraTotal + "</b> en cartera</span>" +
      r.salud.map(function (s) {
        return "<button type='button' class='sf" + (s.ojo ? " ojo" : "") + "'>" +
          "<b>" + s.v + "</b> " + s.e + "</button>";
      }).join("") + "</div>" +
      "<div class='barras'>" + datos.map(function (d, i) {
        return "<button type='button' class='bfila' style='--tono:" + (ejeCartera === "etapa" ? rampa[i] : "var(--accion)") + "'>" +
          "<span class='n'>" + d[0] + "</span>" +
          "<span class='riel'><i style='width:" + (d[1] / total * 100).toFixed(1) + "%'></i></span>" +
          "<span class='c'>" + d[1] + "</span></button>";
      }).join("") + "</div>";
  }

  /* ---------- Embudo · cada salto nombra origen y destino ---------- */

  var TONO_SALTO = { oferta: [0, 1, 1], demanda: [2, 2, 3] };
  var RESPUESTA = {
    oferta: [
      { q: "Contactar las prospecciones registradas que siguen sin primer contacto.", n: "prospecciones", n1: "prospección" },
      { q: "Revisar las prospecciones contactadas que no llegaron a captación.", n: "prospecciones", n1: "prospección" },
      { q: "Publicar las captaciones aprobadas que aún no salieron al mercado.", n: "captaciones", n1: "captación" }
    ],
    demanda: [
      { q: "Agendar visita para las oportunidades que aún no la tienen.", n: "oportunidades", n1: "oportunidad" },
      { q: "Revisar las oportunidades visitadas que no avanzaron a solicitud.", n: "oportunidades", n1: "oportunidad" },
      { q: "Revisar las solicitudes aprobadas que siguen sin contrato.", n: "solicitudes", n1: "solicitud" }
    ]
  };

  function pEmbudo() {
    var r = R(), s = r[ejeEmbudo], tonos = TONO_SALTO[ejeEmbudo];
    grupo(document.getElementById("pest-embudo"),
      [{ v: "demanda", e: "Demanda" }, { v: "oferta", e: "Oferta" }], ejeEmbudo, "emb");
    document.getElementById("der-embudo").textContent = "en " + etiqPeriodo();

    /* El cuello es el salto que menos retiene, PERO solo entre los que
       tienen base suficiente: un 100 % con N=1 no es un buen salto, es un
       dato sin muestra, y tampoco puede ser el peor. */
    var peor = -1, min = 101;
    s.forEach(function (f, i) {
      if (f[2] < UMBRAL.muestraMinima) return;
      var pc = Math.round(f[3] / f[2] * 100);
      if (pc < min) { min = pc; peor = i; }
    });

    var html = s.map(function (f, i) {
      /* UN TRAMO SIN CASOS NO TIENE TASA. Con 0 de origen, el porcentaje era
         0/0 = NaN y se colaba en pantalla. No se calcula: se dice. */
      var vacio = f[2] === 0;
      var magro = !vacio && f[2] < UMBRAL.muestraMinima;
      var pc = vacio ? null : Math.round(f[3] / f[2] * 100);
      var quedan = f[2] - f[3];
      var resto = quedan === 0 ? "sin pérdidas" : (quedan === 1 ? "1 se quedó" : quedan + " se quedaron");
      /* Los dos conteos se anclan a los extremos de la barra: entran 24 por la
         izquierda, salen 16 por la derecha, y en medio se ve el reparto. */
      return "<div class='salto" + (i === peor ? " cuello" : "") + (vacio || magro ? " magro" : "") +
        "' style='--tono:" + RAMPA[tonos[i]] + "'>" +
        "<span class='par'><b>" + f[0] + " → " + f[1].toLowerCase() + "</b></span>" +
        "<span class='de'>" + f[2] + "</span>" +
        "<span class='via'>" +
          "<i class='pasa' style='width:" + (vacio ? 0 : pc) + "%" +
            (vacio || magro ? ";background:var(--plata)" : "") + "'></i>" +
          "<i class='cae' style='width:" + (vacio ? 100 : 100 - pc) + "%'></i>" +
        "</span>" +
        "<span class='a'>" + f[3] + "</span>" +
        /* Con la barra puesta, "8 se quedaron" es lo que YA SE VE en la trama.
           Cuando hay una advertencia, manda la advertencia: ocupa el sitio. */
        "<span class='fin'><span class='pc'>" + (vacio ? "—" : pc + "&thinsp;%") + "</span>" +
        "<span class='ns'>" + (vacio ? "sin casos" : (magro ? "muestra corta" : resto)) + "</span></span></div>";
    }).join("");

    if (peor < 0) {
      html += "<div class='reco magra'><span class='mk'></span><div class='txt'>" +
        "<span class='linea'><span class='kk'>Sin base suficiente</span></span>" +
        "<p class='qq'>Ningún salto llega a " + UMBRAL.muestraMinima + " casos. BROX no señala un cuello " +
        "con esta muestra: un 100 % sobre uno o dos casos no es un buen tramo, es un dato sin base.</p></div></div>";
    } else {
      var resp = RESPUESTA[ejeEmbudo][peor];
      var pend = s[peor][2] - s[peor][3];
      /* El hallazgo y la respuesta, en un solo bloque: "aqui se rompe" y
         "haz esto" son una sola frase, no dos cajas. */
      html += "<div class='reco'><span class='mk'></span><div class='txt'>" +
        "<span class='linea'><span class='kk'>Donde más se pierde · " + s[peor][0] + " → " + s[peor][1].toLowerCase() + "</span>" +
        (pend > 0 ? "<button type='button' class='cta'>Ver " + pend + " " + (pend === 1 ? resp.n1 : resp.n) + " →</button>" : "") + "</span>" +
        "<p class='qq'>" + resp.q + "</p>" +
        /* La concentracion es OTRO hecho, no la coletilla de la recomendacion:
           pegada al final del parrafo se leia como parte de la accion. */
        (esBroker() && r.concentracion && ejeEmbudo === "demanda" && peor === 1
          ? "<p class='qq concentra'><span>Cómo se reparte</span> " + r.concentracion + "</p>" : "") +
        "</div></div>";
    }

    document.getElementById("embudo").innerHTML = html;
  }

  /* ---------- Evolución · una métrica y su meta ---------- */

  function pSerie() {
    var r = R();
    if (r.evoMetricas.filter(function (m) { return m.v === metricaEvo; }).length === 0) metricaEvo = r.evoMetricas[0].v;
    var sel = document.getElementById("sel-evo");
    var firma = r.evoMetricas.map(function (m) { return m.v; }).join("|");
    if (sel.dataset.firma !== firma) {
      sel.innerHTML = r.evoMetricas.map(function (m) { return "<option value='" + m.v + "'>" + m.e + "</option>"; }).join("");
      sel.dataset.firma = firma;
    }
    sel.value = metricaEvo;

    /* La evolucion ensena SEIS TRAMOS DEL MISMO TAMAÑO que el filtro: con "3
       meses" seleccionado, seis trimestres. Dejarla siempre en meses mientras
       el filtro dice "7 dias" era comparar dos escalas sin avisar. Cada punto
       vale lo que un periodo entero, asi que se escala igual que la meta. */
    var tr = TRAMOS[periodo] || TRAMOS["1m"];
    var v = r.series[metricaEvo].map(function (x) { return Math.max(0, Math.round(x * PERIODO.f)); });
    var meta = Math.max(1, Math.round(r.metasSerie[metricaEvo] * PERIODO.f));
    /* El ultimo tramo es el EN CURSO: se sustituye por lo que llevas, que es
       lo que ensena la esfera de arriba. Dejarlo completo lo hacia parecer
       cerrado y comparable con los cinco anteriores, y no lo es. */
    var kpiActual = r.kpis.filter(function (k) { return k.clave === metricaEvo; })[0];
    if (kpiActual) v[v.length - 1] = kpiActual.actual;
    var idx = ["prospeccion", "captacion", "solicitud", "contrato"].indexOf(metricaEvo);
    var color = CRUDO[idx < 0 ? 1 : idx];
    var w = 320, h = 92, pl = 8, pt = 14, pb = 18, n = v.length;
    /* El margen derecho lo decide EL NUMERO, no una constante: con el equipo a
       un año el ultimo tramo tiene cuatro cifras y se salia del lienzo. */
    var pd = Math.max(32, 14 + String(v[n - 1]).length * 7);
    var hi = Math.max(Math.max.apply(null, v), meta), lo = Math.min.apply(null, v);
    var rango = Math.max(hi - lo, 2), b0 = Math.max(0, lo - rango * 0.3), techo = hi + rango * 0.18;
    var x = function (j) { return pl + ((w - pl - pd) * j) / (n - 1); };
    var y = function (t) { return h - pb - ((h - pt - pb) * (t - b0)) / (techo - b0); };

    var linea = v.map(function (t, j) { return (j ? "L" : "M") + x(j).toFixed(1) + " " + y(t).toFixed(1); }).join(" ");
    /* EL VALOR ESQUIVA LA LINEA DE META. Los dos rotulos vivian en el borde
       derecho y, cuando el ultimo tramo se acercaba a la meta, se montaban --
       "44" y "meta" salian encima uno del otro y no se leia ninguno. El
       rotulo de la meta se muda a la izquierda, y el valor se coloca SIEMPRE
       encima de su punto: a la misma altura chocaba con el rotulo del ultimo
       tramo cuando el mes en curso venia bajo. Si arriba pisa la meta se va
       debajo, y si tampoco cabe se aparta de la linea por el lado con mas
       sitio; nunca sale del area.

       El choque se mide contra la CAJA del numero, no contra su base: a 11.5px
       la caja va de base-12 a base+3, asi que la franja prohibida no es
       simetrica. Sin esto quedaba un caso -- equipo, 6 meses, solicitudes -- con
       el 137 a 4px del final de la linea y a su misma altura: no se tocaban,
       pero se leia cruzado. */
    var yP = y(v[n - 1]), yM = y(meta);
    var lim = function (yy) { return Math.min(Math.max(yy, pt + 3), h - pb - 3); };
    var pisa = function (yy) { var d = yy - yM; return d < 14 && d > -6; };
    var arr = lim(yP - 7), abj = lim(yP + 13);
    var yEtq = !pisa(arr) ? arr
      : (!pisa(abj) ? abj
        : (yM - (pt + 3) > (h - pb - 3) - yM ? lim(yM - 8) : lim(yM + 16)));

    var puntos = v.map(function (t, j) {
      var u = j === n - 1;
      return '<circle cx="' + x(j).toFixed(1) + '" cy="' + y(t).toFixed(1) + '" r="' + (u ? 3.8 : 2.4) +
        '" fill="#FFFFFF" stroke="' + color + '" stroke-width="' + (u ? 2.4 : 1.6) + '"/>' +
        (u ? '<text x="' + (x(j) + 8).toFixed(1) + '" y="' + yEtq.toFixed(1) +
          '" font-size="11.5" font-weight="700" fill="' + color + '">' + t + '</text>' : "");
    }).join("");
    var etq = tr.etq.map(function (m, j) {
      /* El PRIMER rotulo se ancla al borde en vez de centrarse en su punto:
         centrado se salia del lienzo y perdia la primera letra -- "ar" por
         "Mar", "021" por "2021" --. El ultimo no lo necesita porque pd ya
         reserva a su derecha el ancho del numero. */
      var pri = j === 0;
      return '<text x="' + (pri ? "0" : x(j).toFixed(1)) + '" y="' + (h - 4) +
        '" text-anchor="' + (pri ? "start" : "middle") + '" font-size="10" fill="#6C7681">' + m + '</text>';
    }).join("");

    document.getElementById("serie").innerHTML =
      '<path d="' + linea + " L" + x(n - 1).toFixed(1) + " " + (h - pb) + " L" + x(0).toFixed(1) + " " + (h - pb) +
      ' Z" fill="' + color + '" opacity=".07"/>' +
      /* La meta es una linea, no un punto: se ve de un vistazo si la serie
         la cruza o se queda debajo todo el semestre. */
      '<line x1="' + (pl + 30) + '" y1="' + y(meta).toFixed(1) + '" x2="' + (w - pd + 4) + '" y2="' + y(meta).toFixed(1) +
      '" stroke="#6C7681" stroke-width="1.2" stroke-dasharray="4 3" opacity=".65"/>' +
      /* El rotulo se pone al principio de la linea, no al final: el final es
         donde vive el valor del tramo en curso y ahi solo cabe uno. */
      '<text x="' + pl + '" y="' + (y(meta) + 3.5).toFixed(1) + '" font-size="9.5" font-weight="600" fill="#6C7681">meta</text>' +
      '<path class="real" d="' + linea + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      puntos + etq;

    var eti = r.evoMetricas.filter(function (m) { return m.v === metricaEvo; })[0].e;
    /* "meta 15 por tramo" no lo dice nadie. La meta se nombra con la unidad de
       tiempo que el filtro ya eligio -- al mes, por trimestre, al año -- que es
       ademas lo que vale cada punto de la serie. */
    document.getElementById("evo-lead").innerHTML =
      eti + " · últim" + (tr.rot.indexOf("semanas") >= 0 ? "as " : "os ") + tr.rot +
      " · meta <b>" + meta + "</b> " + PERIODO.cada;
  }

  /* ---------- Metodología ---------- */

  var DOC = {
    ritmo: {
      t: "Cómo se lee el ritmo", s: "Los cuatro KPI y sus esferas",
      c: "<p>Los <b>cuatro indicadores son los mismos para agente y broker</b>, con la misma definición. Lo único " +
         "que cambia es el alcance: la gestión de una persona o la <b>suma del equipo</b>. Por eso un broker puede " +
         "abrir a un agente y entender de dónde sale su total.</p>" +
         "<p class='bloq'>El semáforo mide <b>proyección al cierre</b>, no consumo: si mantienes el ritmo que llevas, " +
         "¿en cuánto acabas? Con 5 de 15 en el día 5 de 30, el criterio de consumo diría <b>rojo</b> —solo el 33 % de " +
         "la meta— y la proyección dice <b>verde</b>: a este ritmo cierras en 30. La pregunta que contesta el color " +
         "es «¿voy camino de llegar?», no «¿ya llegué?».</p>" +
         "<p>Dos guardas lo protegen: mientras el periodo lleve <b>menos del 15 %</b> no hay rojo —no hay recorrido " +
         "para proyectar nada— y <b>si falta una unidad, nunca es rojo</b>.</p>" +
         "<p><b>Cuánto abrir para llegar.</b> Si tu conversión se mantiene, la meta pide un volumen concreto aguas arriba: con 7 de cada 10 prospecciones llegando a contacto y una meta de 24, harían falta <b>34 prospecciones</b> abiertas. Es una <b>estimación</b>, no un hecho, y por eso vive aquí y no en la tarjeta.</p>" +
         "<p>La esfera contesta cinco cosas: <b>actual</b> y <b>meta</b> en el centro, <b>arco recorrido</b> con su " +
         "manija, su <b>prolongación tenue</b> hasta donde llegarás, <b>marca fina</b> al final del recorrido —la " +
         "meta— y una <b>marca discreta dentro</b>, la meta hasta hoy. <b>El arco lleva el color del estado</b>, no el " +
         "del KPI: la identidad vive en el filete de la cabecera, porque un anillo azul junto a un «fuera de ritmo» " +
         "rojo se contradice.</p>" +
         "<p><b>De dónde sale la «meta hasta hoy».</b> Es la misma meta del periodo, repartida por los días que llevas: " +
         "con meta de <b>24</b> y <b>26 días de 30</b> recorridos, sale <b>24 × 26 ÷ 30 = 21</b>. No es una tarea del " +
         "día ni un objetivo aparte — es la única forma de saber si vas a tiempo antes de que el periodo acabe.</p>" +
         "<p>Un KPI <b>sin meta</b> no se pinta como un cero: no hay porcentaje, ni faltante, ni meta hasta hoy. Y no " +
         "se confunde con <b>muestra insuficiente</b>, que afecta a las conversiones —donde hay un cociente— y nunca " +
         "a un conteo contra una meta.</p>" +
         "<p><b>La meta del equipo es la suma de las metas vigentes</b> de los agentes activos durante el periodo, " +
         "prorrateadas por la política comercial si alguien entra a mitad, tiene licencia o cambia de equipo. Así los " +
         "números reconcilian al abrir a cada persona.</p>" +
         "<p class='bloq'>Nada de esto se calcula en la pantalla. BROX devuelve <code>actual</code>, " +
         "<code>metaPeriodo</code>, <code>metaEsperadaAHoy</code>, <code>porcentajeMeta</code>, <code>faltante</code> " +
         "y <code>estadoRitmo</code>; el frontend solo dibuja. Los umbrales de negocio viven en el dominio.</p>"
    },
    excepcion: {
      t: "Por qué no hay ranking", s: "Pulso del equipo",
      c: "<p>Un <b>«mejor y peor agente» sería falso</b>: alguien con la cartera recién asignada y alguien con " +
         "expedientes maduros no compiten por el mismo puesto. Comparar posiciones premia la antigüedad de la " +
         "cartera, no la gestión.</p>" +
         "<p class='bloq'>Por eso se compara a <b>cada uno contra lo que le toca a estas alturas</b>, y solo aparecen " +
         "quienes necesitan intervención. Es <b>gestión por excepción</b>: si seis de ocho van bien, no hace falta " +
         "leer seis fichas.</p>" +
         "<p>El total y su reparto son <b>cosas distintas</b>. Un equipo puede firmar 21 contratos con meta de 20 " +
         "—todo verde— mientras dos agentes hacen 17 y tres hacen cero. El pulso existe para que ese equipo no se " +
         "vea perfectamente verde.</p>" +
         "<p>Y los cuatro indicadores de <b>Supervisión</b> son lo único de esta pantalla que mide el trabajo del " +
         "broker: su cola de revisión, sus evaluaciones, el seguimiento que debe exigir y el reparto de carga. Los " +
         "contratos del equipo <b>no son mérito suyo</b>.</p>"
    },
    lectura: {
      t: "Cómo clasifica BROX", s: "Las tres columnas",
      c: "<p>Cada señal se compara con <b>su propio periodo anterior</b> y con el umbral de la política comercial. Lo " +
         "que mejora y va por encima entra en <b>vas bien</b>; lo que <b>ya te está costando</b> — vencido, esperando, " +
         "publicado de más — en <b>atiende esto</b>; y lo que <b>todavía no te cuesta pero te va a costar</b>, en " +
         "<b>adelántate</b>.</p>" +
         "<p class='bloq'>La tercera columna no es «lo opcional». Es <b>donde se saca ventaja</b>: renovar el encargo " +
         "antes de que venza, ajustar la renta antes de cumplir 60 días publicada sin cambios, completar la ficha antes " +
         "de que un interesado la pida. Nada de eso urge hoy, y es exactamente lo que separa a un agente que cumple de " +
         "uno que destaca.</p>" +
         "<p class='bloq'>La barra fina aparece <b>solo cuando hay denominador</b>: un porcentaje, un «2 de 5» o un " +
         "valor contra su umbral. Su ausencia dice que eso es un <b>conteo</b>, no una proporción, sin escribirlo.</p>" +
         "<p>Para el broker, las mismas tres columnas cambian de semántica: dejan de hablar de su gestión y hablan de " +
         "<b>supervisión</b> — cuántos agentes van en ritmo, dónde se concentran los seguimientos vencidos, qué parte " +
         "de la cartera está en una sola persona.</p>"
    },
    embudo: {
      t: "Los dos embudos", s: "Qué cuenta cada salto",
      c: "<p><b>No se encadenan.</b> <b>Oferta</b> es entrada de producto —del prospecto a la publicación— y " +
         "<b>demanda</b> es salida —de la oportunidad al contrato—. Una captación puede publicarse sin que exista aún " +
         "ningún interesado, así que ponerlos en una sola fila daría un porcentaje que no significa nada. Comparten " +
         "la rampa de color porque son tramos consecutivos del mismo negocio.</p>" +
         "<p class='bloq'>Cada salto <b>nombra su origen y su destino</b> y enseña las cuatro cifras que lo explican: " +
         "cuántos entraron, cuántos avanzaron, el porcentaje y <b>cuántos se quedaron</b>. «Conversión» a secas era un " +
         "concepto sin denominador y por eso salió de los cuatro KPI.</p>" +
         "<p>Con <b>menos de " + UMBRAL.muestraMinima + " casos no hay conclusión</b>: 1 visita y 1 solicitud son " +
         "100 %, y eso no es un buen salto, es un dato sin muestra. Esos saltos se pintan en gris, declaran su N y " +
         "<b>no pueden ser el cuello</b>.</p>" +
         "<p>Ojo con «visita»: cuenta oportunidades con <b>alguna visita de la ventana, del estado que sea</b>, " +
         "canceladas incluidas. Es herencia del cable, está fijada por test y se corrige con su propia decisión.</p>"
    }
  };

  var velo = document.getElementById("velo"), drawer = document.getElementById("drawer");
  function abrirDoc(k) {
    var d = DOC[k]; if (!d) return;
    document.getElementById("dr-t").textContent = d.t;
    document.getElementById("dr-s").textContent = d.s;
    document.getElementById("dr-c").innerHTML = d.c;
    velo.classList.add("on"); drawer.classList.add("on"); drawer.setAttribute("aria-hidden", "false");
    document.getElementById("dr-x").focus();
  }
  function cerrarDoc() { velo.classList.remove("on"); drawer.classList.remove("on"); drawer.setAttribute("aria-hidden", "true"); }
  velo.addEventListener("click", cerrarDoc);
  document.getElementById("dr-x").addEventListener("click", cerrarDoc);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") cerrarDoc(); });

  /* ---------- Interacción ---------- */

  document.addEventListener("change", function (ev) {
    if (ev.target && ev.target.id === "sel-evo") { metricaEvo = ev.target.value; return pintar(); }
    if (ev.target && ev.target.id === "sel-agente") {
      abierto = ev.target.value || null;
      vistaM = "resumen"; ejeCartera = "etapa"; metricaEvo = "captacion";
      pintar();
    }
  });

  document.addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("button") : null;
    if (!b) return;
    var d = b.dataset;
    if (d.p) { periodo = d.p; return pintar(); }
    if (d.emb) { ejeEmbudo = d.emb; return pintar(); }
    if (d.eje) { ejeCartera = d.eje; return pintar(); }
    if (d.evo) { metricaEvo = d.evo; return pintar(); }
    if (d.vm) { vistaM = d.vm; return pintar(); }
    if (d.doc) { return abrirDoc(d.doc); }
    if (d.volver) { abierto = null; vistaM = "resumen"; ejeCartera = "etapa"; metricaEvo = "captacion"; return pintar(); }
    if (d.rol) {
      rol = d.rol; abierto = null; vistaM = "resumen"; ejeCartera = "etapa"; ejeEmbudo = "demanda"; metricaEvo = "captacion";
      document.querySelectorAll("[data-rol]").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      return pintar();
    }
    if (d.esc) {
      escenario = d.esc;
      PERIODO.transcurridos = d.esc === "arranque" ? 3 : 26;
      document.querySelectorAll("[data-esc]").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      return pintar();
    }
    if (d.vista) {
      document.getElementById("app").classList.toggle("movil", d.vista === "movil");
      document.querySelectorAll("[data-vista]").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      return pintar();
    }
  });

  /* ---------- Móvil ---------- */

  function pVistaMovil(movil) {
    var tarjetas = document.querySelectorAll(".lienzo .t");
    if (!movil) { tarjetas.forEach(function (t) { t.classList.remove("on"); }); return; }
    /* La pestaña lleva clave propia. Antes el nombre del boton ERA la clave de
       la seccion, asi que cambiar "Lectura" por "Como vas" habria dejado el
       movil en blanco -- y en el broker, donde el texto es otro, siempre. */
    var activa = vistaM || "resumen";
    tarjetas.forEach(function (t) { t.classList.toggle("on", t.dataset.m === activa); });
  }

  function pintar() {
    fijarPeriodo();
    pCab(); pTira(); pPulso(); pLectura(); pFoco(); pCartera(); pEmbudo(); pSerie();
    pVistaMovil(document.getElementById("app").classList.contains("movil"));
  }
  pintar();
})();
</script>
