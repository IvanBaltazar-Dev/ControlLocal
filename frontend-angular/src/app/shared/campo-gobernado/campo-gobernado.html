@let p = pregunta();
@switch (p.control) {
  @case ('SELECTOR_MULTIPLE') {
    <fieldset class="campo opciones" [disabled]="soloLectura()">
      <legend>{{ p.rotulo }} @if (p.obligatoria) {<b>*</b>}</legend>
      @for (opcion of p.opciones ?? []; track opcion.valor) {
        <label class="opcion">
          <input
            type="checkbox"
            [checked]="marcadas().has(opcion.valor)"
            (change)="alternar(opcion.valor, $event)"
          />
          <span>{{ opcion.rotulo }}</span>
        </label>
      }
      @if (p.ayuda) {
        <small>{{ p.ayuda }}</small>
      }
    </fieldset>
  }
  @case ('SELECTOR') {
    <label class="campo">
      <span>{{ p.rotulo }} @if (p.obligatoria) {<b>*</b>}</span>
      <select [value]="valor()" [disabled]="soloLectura()" (change)="responder($event)">
        <!-- Sin elegir es '': nunca la primera opción. Un defecto que nadie
             eligió es un dato inventado. -->
        <option value="">Sin declarar</option>
        @for (opcion of p.opciones ?? []; track opcion.valor) {
          <option [value]="opcion.valor">{{ opcion.rotulo }}</option>
        }
      </select>
      @if (p.ayuda) {
        <small>{{ p.ayuda }}</small>
      }
    </label>
  }
  @case ('INTERRUPTOR') {
    <!-- Tres estados, no dos. Una casilla sin marcar se lee igual que un «no»,
         y «todavía no se sabe» no es «no». -->
    <label class="campo">
      <span>{{ p.rotulo }} @if (p.obligatoria) {<b>*</b>}</span>
      <select [value]="valor()" [disabled]="soloLectura()" (change)="responder($event)">
        <option value="">Sin declarar</option>
        <option value="true">Sí</option>
        <option value="false">No</option>
      </select>
      @if (p.ayuda) {
        <small>{{ p.ayuda }}</small>
      }
    </label>
  }
  @case ('IMPORTE') {
    <!-- Cifra Y moneda: un importe sin moneda no es un importe, y el Core lo
         rechaza. Van juntos porque separarlos sería pedirle al cliente que los
         una. -->
    <label class="campo importe">
      <span>{{ p.rotulo }} @if (p.obligatoria) {<b>*</b>}</span>
      <span class="par">
        <select
          class="moneda"
          [value]="moneda()"
          [disabled]="soloLectura()"
          (change)="responderMoneda($event)"
          [attr.aria-label]="'Moneda de ' + p.rotulo"
        >
          <option value="">—</option>
          @for (m of MONEDAS; track m.valor) {
            <option [value]="m.valor">{{ m.rotulo }}</option>
          }
        </select>
        <input
          type="number"
          [value]="valor()"
          [readOnly]="soloLectura()"
          [attr.min]="p.restricciones?.minimo"
          [attr.max]="p.restricciones?.maximo"
          step="any"
          (input)="responder($event)"
        />
      </span>
      @if (p.ayuda) {
        <small>{{ p.ayuda }}</small>
      }
    </label>
  }
  @default {
    <label class="campo">
      <span>
        {{ p.rotulo }}
        @if (p.obligatoria) {<b>*</b>}
        @if (p.unidad && p.unidad !== 'moneda') {
          <em>({{ p.unidad }})</em>
        }
      </span>
      <input
        [type]="tipoEntrada()"
        [value]="valor()"
        [readOnly]="soloLectura()"
        [attr.min]="p.restricciones?.minimo"
        [attr.max]="p.restricciones?.maximo"
        [attr.maxlength]="p.restricciones?.longitudMaxima"
        [attr.step]="p.restricciones?.decimales === 0 ? 1 : 'any'"
        (input)="responder($event)"
      />
      @if (p.ayuda) {
        <small>{{ p.ayuda }}</small>
      }
    </label>
  }
}
