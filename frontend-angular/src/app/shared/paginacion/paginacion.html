<div class="paginacion">
  <span class="rango">Mostrando {{ desde() }}–{{ hasta() }} de {{ total() }} resultados</span>

  <!--
    Los botones solo cuando hay más de una página. El RANGO, en cambio, se
    muestra siempre: «Mostrando 1–8 de 8 resultados» dice cuántos hay, y
    esconderlo obligaba a contar filas a ojo. Antes esto lo decidía cada
    pantalla con un `@if (total > porPagina)` repetido en 18 plantillas, así que
    una lista corta no mostraba nada en absoluto.
  -->
  @if (ultima() > 1) {
    <nav class="botones" aria-label="Paginación">
      <button
        type="button"
        [disabled]="actual() === 1"
        (click)="ir(actual() - 1)"
        aria-label="Anterior"
      >
        ‹
      </button>

      @for (p of paginas(); track $index) {
        @if (p === null) {
          <span class="elipsis" aria-hidden="true">…</span>
        } @else {
          <button
            type="button"
            [class.activa]="p === actual()"
            [attr.aria-current]="p === actual() ? 'page' : null"
            (click)="ir(p)"
          >
            {{ p }}
          </button>
        }
      }

      <button
        type="button"
        [disabled]="actual() === ultima()"
        (click)="ir(actual() + 1)"
        aria-label="Siguiente"
      >
        ›
      </button>
    </nav>
  }
</div>
