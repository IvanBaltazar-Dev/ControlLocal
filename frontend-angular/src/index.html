<!doctype html>
<!--
  `lang="es"`, no el `en` que dejó `ng new`: BROX está escrito entero en
  español y el idioma declarado es lo que usa el lector de pantalla para
  elegir voz y pronunciación. Con `en` leía «Captaciones» y «Propietarios»
  con fonética inglesa.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>BROX</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
