<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ControlLocal — Prototipo visual</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; font-family: 'Inter', system-ui, sans-serif; }
  #root { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="components/icons.jsx"></script>
<script type="text/babel" src="components/shared.jsx"></script>
<script type="text/babel" src="screens/01-auth-dashboard.jsx"></script>
<script type="text/babel" src="screens/02-admin-captacion.jsx"></script>
<script type="text/babel" src="screens/03-captaciones.jsx"></script>
<script type="text/babel" src="screens/04-oportunidades.jsx"></script>
<script type="text/babel" src="screens/05-comercial.jsx"></script>
<script type="text/babel" src="screens/06-reportes.jsx"></script>
<script type="text/babel" src="screens/07-architecture.jsx"></script>

<script type="text/babel" data-presets="react">
  const W = 1440, H = 920, WL = 1000, HL = 700;

  // Helper: wrap a screen with a fixed-role NavCtx so role-aware screens
  // (Solicitudes, Oportunidades, Reportes, etc.) render the right variant
  // in the static canvas without needing real navigation.
  const AsRole = ({ role, children }) => (
    <NavCtx.Provider value={{ navigate: () => {}, role, route: null, setRole: () => {} }}>
      {children}
    </NavCtx.Provider>
  );

  const App = () => (
    <DesignCanvas>
      <DCSection id="overview" title="ControlLocal · Prototipo visual"
        subtitle="Sistema web transaccional para corretaje de locales comerciales. Pantallas agrupadas por rol — Broker administrador, Broker normal y Agente inmobiliario — siguiendo las reglas vigentes del MVP.">
        <DCArtboard id="proto-link" label="▶ Prototipo navegable (clic para abrir)" width={420} height={260}>
          <a href="prototype.html" style={{ display: 'flex', flexDirection: 'column', width: '100%', height: '100%', textDecoration: 'none', color: '#0B1F33', background: 'linear-gradient(160deg, #0B1F33 0%, #14304F 100%)', padding: 26, boxSizing: 'border-box', justifyContent: 'space-between' }}>
            <div style={{ color: '#fff' }}>
              <div style={{ fontSize: 11, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'rgba(255,255,255,0.55)' }}>Demo interactiva</div>
              <div style={{ fontSize: 22, fontWeight: 600, marginTop: 8, letterSpacing: '-0.015em' }}>Abrir prototipo navegable →</div>
              <div style={{ fontSize: 12.5, color: 'rgba(255,255,255,0.7)', marginTop: 8, lineHeight: 1.5 }}>
                Login con elección de rol, sidebar adaptado por perfil y flujos completos por rol.
              </div>
            </div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              {['Broker administrador','Broker','Agente inmobiliario'].map((r,i)=>(
                <span key={i} style={{ fontSize: 11, color: 'rgba(255,255,255,0.75)', background: 'rgba(255,255,255,0.08)', padding: '4px 8px', borderRadius: 4 }}>{r}</span>
              ))}
            </div>
          </a>
        </DCArtboard>
        <DCArtboard id="arch" label="00 · Arquitectura visual de componentes" width={1280} height={1700}>
          <ScreenArchitecture />
        </DCArtboard>
      </DCSection>

      <DCSection id="auth" title="01 · Acceso al sistema"
        subtitle="Login con elección de rol · restablecimiento administrado internamente (no hay flujo público de recuperación en el MVP).">
        <DCArtboard id="login" label="01 · Login" width={WL} height={HL}>
          <ScreenLogin />
        </DCArtboard>
        <DCArtboard id="recover" label="02 · Restablecimiento administrado" width={WL} height={HL}>
          <ScreenRecover />
        </DCArtboard>
      </DCSection>

      <DCSection id="admin-flow" title="02 · Broker administrador"
        subtitle="Dashboard global · gestión de brokers · reasignación e intervención de agentes entre brokers · auditoría global · reportes globales. NO registra captaciones, locales, propietarios ni clientes.">
        <DCArtboard id="dash-admin" label="A1 · Dashboard global" width={W} height={H}>
          <AsRole role="Broker administrador"><ScreenDashboard /></AsRole>
        </DCArtboard>
        <DCArtboard id="brokers" label="A2 · Gestión de brokers" width={W} height={H}>
          <ScreenBrokers />
        </DCArtboard>
        <DCArtboard id="reasignar" label="A3 · Reasignación de agentes entre brokers" width={W} height={1180}>
          <AsRole role="Broker administrador"><ScreenReasignarAgentes /></AsRole>
        </DCArtboard>
        <DCArtboard id="audit" label="A4 · Auditoría global" width={W} height={H}>
          <ScreenActividad />
        </DCArtboard>
        <DCArtboard id="reports-global" label="A5 · Reportes globales" width={W} height={1180}>
          <AsRole role="Broker administrador"><ScreenReportes /></AsRole>
        </DCArtboard>
        <DCArtboard id="catalogs" label="A6 · Catálogos del sistema" width={W} height={H}>
          <ScreenCatalogs />
        </DCArtboard>
      </DCSection>

      <DCSection id="broker-flow" title="03 · Broker normal"
        subtitle="Supervisa a sus agentes · revisa captaciones, evalúa solicitudes, reasigna dentro de su equipo. Registra agentes (con relación de supervisión activa). NO registra captaciones, locales, propietarios ni clientes.">
        <DCArtboard id="dash-broker" label="B1 · Dashboard de equipo" width={W} height={H}>
          <AsRole role="Broker"><ScreenDashboard /></AsRole>
        </DCArtboard>
        <DCArtboard id="agents" label="B2 · Mis agentes inmobiliarios" width={W} height={H}>
          <ScreenAgents />
        </DCArtboard>
        <DCArtboard id="bandeja-cap" label="B3 · Captaciones por revisar (bandeja)" width={W} height={H}>
          <AsRole role="Broker"><ScreenBandejaCaptaciones /></AsRole>
        </DCArtboard>
        <DCArtboard id="cap-review" label="B4 · Revisión de captación" width={W} height={1080}>
          <AsRole role="Broker"><ScreenCaptacionReview /></AsRole>
        </DCArtboard>
        <DCArtboard id="bandeja-sol" label="B5 · Solicitudes por evaluar (bandeja)" width={W} height={H}>
          <AsRole role="Broker"><ScreenSolicitudes /></AsRole>
        </DCArtboard>
        <DCArtboard id="evaluation" label="B6 · Evaluación de solicitud" width={W} height={H}>
          <AsRole role="Broker"><ScreenEvaluacion /></AsRole>
        </DCArtboard>
        <DCArtboard id="ops-team" label="B7 · Operaciones del equipo" width={W} height={H}>
          <AsRole role="Broker"><ScreenOportunidades /></AsRole>
        </DCArtboard>
        <DCArtboard id="reports-team" label="B8 · Reportes de equipo" width={W} height={1180}>
          <AsRole role="Broker"><ScreenReportes /></AsRole>
        </DCArtboard>
      </DCSection>

      <DCSection id="agent-flow" title="04 · Agente inmobiliario"
        subtitle="Único perfil que registra propietarios, locales, captaciones, clientes interesados, oportunidades, interacciones, visitas, solicitudes, documentos y motivos de no continuidad.">
        <DCArtboard id="dash-agent" label="C1 · Dashboard operativo" width={W} height={H}>
          <AsRole role="Agente inmobiliario"><ScreenDashboard /></AsRole>
        </DCArtboard>
        <DCArtboard id="owners" label="C2 · Propietarios" width={W} height={H}>
          <ScreenOwners />
        </DCArtboard>
        <DCArtboard id="locales" label="C3 · Locales comerciales" width={W} height={H}>
          <ScreenLocales />
        </DCArtboard>
        <DCArtboard id="captaciones" label="C4 · Mis captaciones (listado)" width={W} height={H}>
          <ScreenCaptaciones />
        </DCArtboard>
        <DCArtboard id="cap-form" label="C5 · Registro de captación" width={W} height={1180}>
          <ScreenCaptacionForm />
        </DCArtboard>
        <DCArtboard id="clients" label="C6 · Clientes interesados" width={W} height={H}>
          <ScreenClientes />
        </DCArtboard>
        <DCArtboard id="opportunities" label="C7 · Oportunidades comerciales" width={W} height={H}>
          <AsRole role="Agente inmobiliario"><ScreenOportunidades /></AsRole>
        </DCArtboard>
        <DCArtboard id="op-new" label="C8 · Creación de oportunidad" width={W} height={1100}>
          <ScreenOportunidadNueva />
        </DCArtboard>
        <DCArtboard id="op-detail" label="C9 · Detalle 360 de oportunidad ★" width={W} height={1180}>
          <ScreenDetail360 />
        </DCArtboard>
        <DCArtboard id="interactions" label="C10 · Interacciones" width={W} height={H}>
          <ScreenInteracciones />
        </DCArtboard>
        <DCArtboard id="visits" label="C11 · Visitas" width={W} height={1180}>
          <ScreenVisitas />
        </DCArtboard>
        <DCArtboard id="requests" label="C12 · Solicitudes de alquiler" width={W} height={H}>
          <AsRole role="Agente inmobiliario"><ScreenSolicitudes /></AsRole>
        </DCArtboard>
        <DCArtboard id="documents" label="C13 · Documentos de solicitud" width={W} height={H}>
          <ScreenDocumentos />
        </DCArtboard>
        <DCArtboard id="closing" label="C14 · Cierre de oportunidad / Motivos no continuidad" width={W} height={1100}>
          <ScreenCierre />
        </DCArtboard>
        <DCArtboard id="profile" label="C15 · Mi perfil" width={W} height={H}>
          <AsRole role="Agente inmobiliario"><ScreenProfile /></AsRole>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
